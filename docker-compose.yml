# Simulate high-traffic provisioning: two identical app replicas
# behind a reverse proxy. Scale with: docker compose up --scale app=4
services:
  app:
    build: .
    environment:
      APP_SECRET: change-me-in-production
      DATA_DIR: /data
    volumes:
      - transit-data:/data
    expose:
      - "8001"
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  transit-data:
