events { worker_connections 1024; }
http {
  upstream transit {
    least_conn;
    server app:8001;
  }
  server {
    listen 80;
    location /api/health {
      proxy_pass http://transit;
    }
    location / {
      proxy_pass http://transit;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
